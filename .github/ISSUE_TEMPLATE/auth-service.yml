name: Auth Service CI
run-name: Run Auth Service CI by ${{ github.actor }}

on:
  push:
    branches: [main]
    paths: ['auth-service/**']
  pull_request:
    branches: [main]
    paths: ['auth-service/**']

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Test

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'auth-service/pom.xml'

      - name: Build with Maven
        run: mvn -B clean install -DskipTests --file auth-service/pom.xml

      - name: Run Tests
        run: mvn -B test --file auth-service/pom.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: auth-service/target/surefire-reports/
